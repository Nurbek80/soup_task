services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: soup
      POSTGRES_PASSWORD: soup
      POSTGRES_DB: soup
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soup -d soup"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    command: api
    environment: &app-env
      DATABASE_URL: postgres://soup:soup@db:5432/soup?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  worker:
    build: .
    command: worker
    environment:
      <<: *app-env
      LEASE_MS: "3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 4

volumes:
  postgres-data:
